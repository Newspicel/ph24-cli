# Regenerates the commands, skill and docs from the live ph24 OpenAPI spec and error catalogue,
# and commits when the API changed.
name: Regenerate from the API spec
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run generate
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No API changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate from the ph24 OpenAPI spec"
          git push
