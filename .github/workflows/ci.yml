name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
      - name: dist/ph24.js is up to date
        run: git diff --exit-code dist/ph24.js
      - name: built CLI runs on Node
        run: node dist/ph24.js --version && node dist/ph24.js public health
